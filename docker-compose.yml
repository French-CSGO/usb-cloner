services:
  usb-cloner:
    build: .
    image: ghcr.io/french-csgo/usb-cloner:latest
    container_name: usb-cloner
    restart: unless-stopped

    # Required for raw disk access (dd, mount, blockdev)
    privileged: true

    volumes:
      - /dev:/dev        # expose all block devices
      - /mnt:/mnt        # share host mount namespace (SSHD mode only)
      - ./data:/data     # persistent logs, associations, local images

    ports:
      - "5000:5000"

    environment:
      PYTHONUNBUFFERED: "1"
      # Always local — never change these
      LOG_FILE:   /data/usb_manager.log
      ASSOC_FILE: /data/usb_associations.conf

      # ── Dual storage ─────────────────────────────────────────────
      # SSD  = fast local storage (master images + active profiles)
      # SSHD = external disk mounted on demand (permanent archive)
      SSD_DIR:          /data/images          # embedded SSD
      SSD_JOUEURS_DIR:  /data/images/joueurs
      SSHD_DIR:         /mnt/sshd/images      # external SSHD
      SSHD_JOUEURS_DIR: /mnt/sshd/images/joueurs

  # ── Demo mode ─────────────────────────────────────────────────────
  # No USB keys needed. Fake drives (sdc/sdd/sde) appear in the UI
  # and all dd operations are simulated with realistic progress.
  #
  # docker compose --profile demo up
  usb-cloner-demo:
    profiles: [demo]
    build: .
    container_name: usb-cloner-demo
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    environment:
      PYTHONUNBUFFERED: "1"
      DEMO_MODE:        "1"
      SSD_DIR:          /data/images
      SSD_JOUEURS_DIR:  /data/images/joueurs
      SSHD_DIR:         /mnt/sshd/images
      SSHD_JOUEURS_DIR: /mnt/sshd/images/joueurs
      HISTORY_FILE:     /data/historique_tournoi.log
      LOG_FILE:         /data/usb_manager.log
      ASSOC_FILE:       /data/usb_associations.conf
